# Groups GitHub's generated release notes by pull request label.
changelog:
  exclude:
    labels: ["skip-changelog"]
    authors: ["dependabot[bot]"]
  categories:
    - title: Security
      labels: ["security"]
    - title: New features
      labels: ["enhancement", "feature"]
    - title: Bug fixes
      labels: ["bug"]
    - title: Documentation
      labels: ["documentation"]
    - title: Other changes
      labels: ["*"]
